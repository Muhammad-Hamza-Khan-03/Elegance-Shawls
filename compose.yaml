# Self-hosted production stack. Copy .env.example to .env and fill in every
# value; see DEPLOYMENT.md. Only the Caddy proxy publishes host ports (PostgreSQL publishes none).
services:
  postgres:
    # Same pinned image as compose.ai.yaml. Bump tag and digest together and re-run the checks.
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elegance_shawls}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-elegance_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-elegance_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-elegance_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?Set POSTGRES_BACKUP_PASSWORD}
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=128MB"]
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data volume: extension, least-privilege app role, read-only backup role.
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot schema migration, never started by `up`. An operator runs it deliberately, after a
  # backup and an explicit go-ahead (DEPLOYMENT.md "Database migrations"):
  #   docker compose --profile tools run --rm migrate
  migrate:
    build: ./apps/backend
    image: elegance-backend:${APP_VERSION:-local}
    profiles: [tools]
    environment:
      DATABASE_URL: &database-url postgresql+asyncpg://${POSTGRES_APP_USER:-elegance_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-elegance_shawls}
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./apps/backend
    image: elegance-backend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      ALLOWED_ORIGINS: ${SITE_URL:?Set SITE_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      ENVIRONMENT: production
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-60}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      # Optional WhatsApp bridge (docs: OPERATIONS.md). false = wa.me link mode, exactly as before.
      WHATSAPP_BRIDGE_ENABLED: ${WHATSAPP_BRIDGE_ENABLED:-false}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      WHATSAPP_BOT_PAUSE_HOURS: ${WHATSAPP_BOT_PAUSE_HOURS:-12}
      # The backend is reachable only through the proxy, which overwrites X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    networks: [data, web]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:?Set WHATSAPP_NUMBER}
    image: elegance-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy

  # ---- Optional WhatsApp automation: `--profile whatsapp`. Nothing here is reachable from `web` or the proxy. ----
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    # noeviction: a full stream rejects writes (the bridge retries) instead of dropping messages.
    command:
      - sh
      - -c
      - test -n "$$REDIS_PASSWORD" || { echo "Set REDIS_PASSWORD" >&2; exit 1; }; exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    mem_limit: 192m
    cpus: 0.5
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  whatsapp-bridge:
    build: ./apps/whatsapp-bridge
    image: elegance-whatsapp-bridge:${APP_VERSION:-local}
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      WHATSAPP_BRIDGE_ENABLED: ${WHATSAPP_BRIDGE_ENABLED:-false}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
    volumes:
      - whatsapp_session:/data/session
    networks: [data, whatsapp_egress]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      redis:
        condition: service_healthy

  whatsapp-consumer:
    image: elegance-backend:${APP_VERSION:-local}
    profiles: [whatsapp]
    restart: unless-stopped
    command: ["python", "-m", "whatsapp.consumer"]
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      WHATSAPP_BRIDGE_ENABLED: ${WHATSAPP_BRIDGE_ENABLED:-false}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      WHATSAPP_BOT_PAUSE_HOURS: ${WHATSAPP_BOT_PAUSE_HOURS:-12}
    networks: [data]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${PROXY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        # Server-side frontend requests to the public URLs stay on the internal network.
        aliases:
          - ${SITE_DOMAIN:?Set SITE_DOMAIN}
          - ${API_DOMAIN:?Set API_DOMAIN}

networks:
  whatsapp_egress: {}    # the only route out, used by the WhatsApp bridge alone
  web: {}
  data:
    # No route outside Docker: PostgreSQL is reachable only from the backend and the migrate job.
    internal: true

volumes:
  whatsapp_session:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
