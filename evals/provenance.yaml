# Provenance of every evaluation dataset (issue #139). Checked by `python evals/provenance.py` and evals/tests/test_provenance.py.
# This file DESCRIBES data; it never upgrades it. Only a signed review record plus the release gate (attestation.py) can make
# data count as release evidence. See the vocabulary and rules at the top of evals/provenance.py.
# Changing a dataset requires changing its sha256 here on purpose, in the same reviewed change.
