apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: elegance }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes: [{ name: tmp, emptyDir: {} }]
      containers:
        - name: frontend
          image: ghcr.io/OWNER/elegance-frontend:REPLACE_WITH_SHA
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: frontend-env } }]
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /api/ready, port: 3000 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: elegance }
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
