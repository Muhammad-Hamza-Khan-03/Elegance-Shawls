apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: elegance }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes: [{ name: tmp, emptyDir: {} }]
      containers:
        - name: backend
          image: ghcr.io/OWNER/elegance-backend:REPLACE_WITH_SHA
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: backend-env } }]
          livenessProbe: { httpGet: { path: /health/, port: 8000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready/, port: 8000 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: elegance }
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
