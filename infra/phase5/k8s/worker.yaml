apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: elegance }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/OWNER/elegance-backend:REPLACE_WITH_SHA
          command: ["arq", "workers.settings.WorkerSettings"]
          envFrom: [{ secretRef: { name: backend-env } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
