name: Security scans
# Separate from ci.yml so a scanner outage never blocks the required checks. Free tools only.
# Not included: CodeQL (needs GitHub Advanced Security on a private repo) and GHCR image publishing (activation); see docs/roadmap/completion-ledger.md.
on:
  pull_request:
  push:
    branches: [integration, staging, main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official image instead of trivy-action: the action's binary download step failed on the runner.
      - run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.65.0 fs
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json
