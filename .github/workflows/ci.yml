name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SITE_URL: https://store.example.invalid
          NEXT_PUBLIC_WHATSAPP_NUMBER: "923001234567"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pytest -q
      - run: python -m compileall -q .
      - run: pip-audit -r requirements.txt

  backend-integration:
    # Real PostgreSQL (pgvector) and Redis via Testcontainers; the default backend job stays container-free.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m integration

  evals:
    # Recorded responses only: pull requests never spend live LLM quota. Suites without data report
    # "not evaluated", which does not fail here but does block `--release-ready`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: python evals/run_evals.py --json evals-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals-report.json

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: false
          tags: elegance-backend:ci
      - uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          push: false
          tags: elegance-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.invalid
            NEXT_PUBLIC_SITE_URL=https://store.example.invalid
            NEXT_PUBLIC_WHATSAPP_NUMBER=923001234567
