name: CI
on:
  push:
    branches: [main, staging, staging-integration]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/frontend/coverage
          retention-days: 7
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SITE_URL: https://store.example.invalid
          NEXT_PUBLIC_WHATSAPP_NUMBER: "923001234567"

  whatsapp-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/whatsapp-bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - run: coverage report --include='utils/pagination.py,security/admin_auth.py' --fail-under=85
      - run: coverage report --fail-under=55
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7
      - run: python -m compileall -q .
      - run: pip-audit -r requirements.txt

  backend-integration:
    # Real PostgreSQL (pgvector) and Redis via Testcontainers; the default backend job stays container-free.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m integration

  evals:
    # Recorded responses only: pull requests never spend live LLM quota. Suites without data report
    # "not evaluated", which does not fail here but does block `--release-ready`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r apps/backend/requirements-dev.txt
      - name: Offline eval unit tests (deterministic, no network)
        run: pytest -q apps/backend/tests/test_evals_runner.py
      - name: Eval run (recorded responses; release readiness remains an explicit gate)
        run: python evals/run_evals.py --json evals-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals-report.json

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  e2e-real-stack:
    # Next.js -> FastAPI -> disposable PostgreSQL (pgvector). No mock API: this is the genuine end-to-end evidence.
    # Synthetic fixtures only (apps/backend/scripts/seed_e2e.py); wa.me is intercepted, no model/provider/Redis is used.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-throwaway
          POSTGRES_DB: elegance_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d elegance_e2e" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://e2e:e2e-throwaway@127.0.0.1:5432/elegance_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r apps/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: npm run test:e2e:real
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-real-stack
          path: apps/frontend/playwright-report-real
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: false
          tags: elegance-backend:ci
      - uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          push: false
          tags: elegance-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.invalid
            NEXT_PUBLIC_SITE_URL=https://store.example.invalid
            NEXT_PUBLIC_WHATSAPP_NUMBER=923001234567
